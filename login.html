<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinicManagement - تسجيل الدخول</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrap { max-width: 460px; margin: 40px auto; }
    .link-btn {
      background: none; border: none; color: #2563eb; cursor: pointer;
      font: inherit; padding: 0; text-decoration: underline;
    }
    .forgot-row { text-align: center; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container auth-wrap">
    <header class="page-header app-header" style="justify-content:center;">
      <div class="brand" style="flex-direction:column; align-items:center; text-align:center;">
        <img src="logo.jpg" alt="ClinicManagement" class="brand-logo" />
        <div class="brand-text" style="text-align:center;">
          <h1>ClinicManagement</h1>
          <p class="brand-tagline">تسجيل الدخول إلى حسابك</p>
        </div>
      </div>
    </header>

    <section class="card">
      <form id="loginForm" autocomplete="on">
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" required /></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="loginPassword" required /></div>
        <div class="actions"><button class="btn primary" type="submit">دخول</button></div>
        <div class="forgot-row">
          <button type="button" class="link-btn" id="forgotBtn">نسيت كلمة المرور؟</button>
        </div>
      </form>
    </section>
  </div>

  <script type="module" src="auth.js?v=17"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    function toast(msg) {
      let el = document.querySelector('.toast');
      if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
      el.textContent = msg; el.classList.add('show');
      clearTimeout(window._t); window._t = setTimeout(() => el.classList.remove('show'), 3500);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#loginEmail').value.trim().toLowerCase();
      const pw = $('#loginPassword').value;
      try {
        await window.BMDAuth.signIn(email, pw);
        location.href = 'home.html';
      } catch (err) { toast(err.message || 'فشل الدخول'); }
    });

    document.getElementById('forgotBtn').addEventListener('click', async () => {
      const email = $('#loginEmail').value.trim().toLowerCase();
      if (!email) { toast('اكتب بريدك الإلكتروني ثم اضغط "نسيت كلمة المرور؟"'); $('#loginEmail').focus(); return; }
      try {
        await window.BMDAuth.resetPassword(email);
        toast('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني');
      } catch (err) { toast(err.message || 'فشل الإرسال'); }
    });
  </script>
</body>
</html>
